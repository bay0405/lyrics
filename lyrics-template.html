<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Where We Are - Lirik</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Courier New', monospace;
      padding: 20px;
    }
    h1 {
      color: #00ffcc;
    }
    pre {
      white-space: pre-wrap;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Where We Are - One Direction</h1>
  <h2>Lirik:</h2>
  <pre id="lyricsDisplay"></pre>

  <script>
    const lyrics = `
Here we are, standing in the light
Of a new day, dawning so bright
Nothing can stop us now, we're here
Where we are is crystal clear

This is where we belong
This is where we stay strong
Side by side, we carry on
Where we are

We've come a long way from where we began
Time flew like sand from the palm of our hand
But here we are, never fell apart
Still standing tall with open hearts

This is where we belong
This is where we stay strong
Side by side, we carry on
Where we are

Every scar, every mile
Led us here with every trial
Now we shine just like the stars
Where we are, that's where we are
    `.trim();

    const display = document.getElementById("lyricsDisplay");
    let index = 0;

    function showLyrics() {
      if (index < lyrics.length) {
        display.textContent += lyrics.charAt(index);
        index++;
        setTimeout(showLyrics, 30); // Ganti kecepatan ketik di sini (ms per karakter)
      }
    }

    showLyrics();
  </script>
</body>
</html>
